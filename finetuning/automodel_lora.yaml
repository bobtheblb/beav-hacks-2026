recipe: FinetuneRecipeForVLM

step_scheduler:
  global_batch_size: 1
  local_batch_size: 1
  ckpt_every_steps: 100000
  val_every_steps: 100000
  num_epochs: 1

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-BF16
  torch_dtype: bf16
  trust_remote_code: true

processor:
  _target_: transformers.AutoProcessor.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-BF16
  trust_remote_code: true

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/mmfr_lora
  model_save_format: safetensors
  save_consolidated: true

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules: '*_proj'
  dim: 8
  alpha: 16
  use_triton: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: finetuning.mmfr_dataset.make_mmfr_dataset
  path_or_dataset: data/mmfr_subset
  split: train

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  shuffle: true

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-4
  weight_decay: 0.01
