recipe: FinetuneRecipeForVLM

# Pass-through to wandb.init(**wandb). Auth via `wandb login` or WANDB_API_KEY.
# Delete this block to disable wandb logging entirely.
wandb:
  project: mmfr-nemotron
  name: nemotron-12b-vl-mmfr-binary-v1
  entity: dchitrak-oregon-state-university
  tags: [mmfr, nemotron-nano-vl, lora, fake-vs-real]

step_scheduler:
  global_batch_size: 1
  local_batch_size: 1
  ckpt_every_steps: 100  # fewer save events = smaller window for mid-save kill to corrupt
  val_every_steps: 300  # will run every x number of gradient steps
  max_steps: 100000000000

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 42
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-BF16
  torch_dtype: bf16
  trust_remote_code: true

processor:
  _target_: finetuning.datasets.load_processor_with_pad
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-Nano-12B-v2-VL-BF16
  trust_remote_code: true

checkpoint:
  enabled: true
  checkpoint_dir: /nfs/hpc/share/chitrakd/checkpoints/mmfr_lora
  model_save_format: safetensors
  save_consolidated: true
  # Stage save artifacts on NFS instead of /tmp (tmpfs/RAM-backed, often <8 GB).
  # Avoids partial writes when a 12B-LoRA checkpoint briefly stages gigabytes.
  staging_dir: /nfs/hpc/share/chitrakd/ckpt_staging

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules: '*_proj'
  dim: 8
  alpha: 16
  use_triton: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
  activation_checkpointing: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: finetuning.datasets.make_cord_v2_dataset
  path_or_dataset: AnnaGao/MMFR-Dataset
  split: train
  n_train_per_class: 3000
  n_val_per_class: 300

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: finetuning.datasets.nemotron_vl_collate_fn

validation_dataset:
  _target_: finetuning.datasets.make_cord_v2_dataset
  path_or_dataset: AnnaGao/MMFR-Dataset
  split: validation
  n_train_per_class: 3000
  n_val_per_class: 300

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: finetuning.datasets.nemotron_vl_collate_fn

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-4
  weight_decay: 0.01
